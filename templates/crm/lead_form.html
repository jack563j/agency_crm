{% extends 'base.html' %}

{% block title %}Create Lead | Agency CRM{% endblock %}
{% block header_title %}Create Inbound Lead{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
        <div class="mb-6 pb-4 border-b border-slate-100 flex items-center justify-between">
            <div>
                <h3 class="text-base font-bold text-slate-900">Lead Information</h3>
                <p class="text-xs text-slate-500">Add a new prospect to your pipeline</p>
            </div>
            <a href="{% url 'lead_list' %}" class="text-xs font-semibold text-slate-500 hover:text-slate-800">
                Cancel
            </a>
        </div>

        <form method="post" class="space-y-4 text-xs">
            {% csrf_token %}
            <div>
                <label class="block font-semibold text-slate-700 mb-1">Lead / Project Title *</label>
                <input type="text" name="title" required placeholder="e.g. Website Redesign & SEO" 
                       class="w-full bg-slate-50 border border-slate-200 focus:bg-white focus:border-teal-500 focus:ring-1 focus:ring-teal-500 rounded-xl px-3.5 py-2.5 text-slate-900 outline-none transition">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Company Name *</label>
                    <input type="text" name="company_name" required placeholder="e.g. Stripe Inc" 
                           class="w-full bg-slate-50 border border-slate-200 focus:bg-white focus:border-teal-500 focus:ring-1 focus:ring-teal-500 rounded-xl px-3.5 py-2.5 text-slate-900 outline-none transition">
                </div>
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Contact Name</label>
                    <input type="text" name="contact_name" placeholder="e.g. Sarah Connor" 
                           class="w-full bg-slate-50 border border-slate-200 focus:bg-white focus:border-teal-500 focus:ring-1 focus:ring-teal-500 rounded-xl px-3.5 py-2.5 text-slate-900 outline-none transition">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Contact Email</label>
                    <input type="email" name="email" placeholder="sarah@stripe.com" 
                           class="w-full bg-slate-50 border border-slate-200 focus:bg-white focus:border-teal-500 focus:ring-1 focus:ring-teal-500 rounded-xl px-3.5 py-2.5 text-slate-900 outline-none transition">
                </div>
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Acquisition Source</label>
                    <select name="source" class="w-full bg-slate-50 border border-slate-200 focus:bg-white focus:border-teal-500 focus:ring-1 focus:ring-teal-500 rounded-xl px-3.5 py-2.5 text-slate-900 outline-none transition">
                        {% for s_val, s_label in sources %}
                        <option value="{{ s_val }}">{{ s_label }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div>
                <label class="block font-semibold text-slate-700 mb-1">Notes & Requirements</label>
                <textarea name="notes" rows="3" placeholder="Budget, timeline, special client notes..." 
                          class="w-full bg-slate-50 border border-slate-200 focus:bg-white focus:border-teal-500 focus:ring-1 focus:ring-teal-500 rounded-xl px-3.5 py-2.5 text-slate-900 outline-none transition"></textarea>
            </div>

            <div class="pt-4 flex justify-end space-x-3">
                <a href="{% url 'lead_list' %}" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl transition">
                    Cancel
                </a>
                <button type="submit" class="px-6 py-2.5 bg-teal-600 hover:bg-teal-500 text-white font-bold rounded-xl shadow-md shadow-teal-600/20 transition">
                    Save Lead
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
